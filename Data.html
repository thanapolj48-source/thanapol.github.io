                                            <PieChart>
                                                <Pie data={accessData} cx="50%" cy="50%" outerRadius="80%" dataKey="value" label={({name, percent}) => `${name} ${(percent * 100).toFixed(0)}%`}>
                                                    {accessData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.name === 'ใช่' ? '#3b82f6' : '#f59e0b'} />)}
                                                </Pie>
                                                <Tooltip content={<CustomTooltip />} /> <Legend wrapperStyle={{fontSize: '14px', paddingTop: '10px'}} />
                                            </PieChart>
                                        </ChartCard>
                                    </SnapBlock>

                                    <SnapBlock>
                                        <ChartCard title="ระดับความเข้าใจเรื่องการคัดแยกขยะ">
                                            <BarChart data={understandingData} margin={{ top: 20, right: 30, left: 0, bottom: 20 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                                <XAxis dataKey="name" tick={{fontSize: 14}} />
                                                <YAxis tick={{fontSize: 14}} />
                                                <Tooltip content={<CustomTooltip />} />
                                                <Bar dataKey="value" fill="#8b5cf6" radius={[6, 6, 0, 0]} barSize={60} />
                                            </BarChart>
                                        </ChartCard>
                                    </SnapBlock>

                                    <SnapBlock>
                                        <ChartCard title="ความเชื่อมั่นต่อหน่วยงานปกครองส่วนท้องถิ่น">
                                            <BarChart data={confidenceData} margin={{ top: 20, right: 30, left: 0, bottom: 20 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#eee" />
                                                <XAxis dataKey="name" tick={{fontSize: 14}} />
                                                <YAxis tick={{fontSize: 14}} />
                                                <Tooltip content={<CustomTooltip />} />
                                                <Bar dataKey="value" fill="#ec4899" radius={[6, 6, 0, 0]} barSize={60} />
                                            </BarChart>
                                        </ChartCard>
                                    </SnapBlock>
                                </div>
                            )}

                            {/* --- PAGE 4: FEEDBACK --- */}
                            {currentPage === 4 && (
                                <div className="flex flex-col w-full animate-in fade-in slide-in-from-right-8 duration-500">
                                    <SnapBlock>
                                        <div className="bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-gray-200 w-full max-w-5xl mx-auto flex flex-col h-[65vh] min-h-[400px] max-h-[700px]">
                                            <h2 className="text-2xl md:text-3xl font-bold text-gray-800 mb-6 flex items-center gap-3">
                                                <Activity className="w-8 h-8 text-blue-500" /> ข้อเสนอแนะเพิ่มเติม
                                            </h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 overflow-y-auto pr-2 pb-4">
                                            {parsedData
                                                .map(row => Object.values(row)[14])
                                                .filter(feedback => feedback && feedback.trim() !== '-' && feedback.trim() !== '')
                                                .map((feedback, idx) => (
                                                <div key={idx} className="bg-blue-50/50 p-5 rounded-2xl border border-blue-100 text-sm md:text-base text-gray-700 shadow-sm leading-relaxed hover:shadow-md transition-shadow">
                                                    "{feedback}"
                                                </div>
                                            ))}
                                            </div>
                                            {parsedData.filter(row => {
                                                const val = Object.values(row)[14];
                                                return val && val.trim() !== '-' && val.trim() !== '';
                                            }).length === 0 && (
                                            <div className="flex flex-col items-center justify-center h-full text-gray-400">
                                                <p className="text-lg italic">ไม่มีข้อเสนอแนะเพิ่มเติมในขณะนี้</p>
                                            </div>
                                            )}
                                        </div>
                                    </SnapBlock>
                                </div>
                            )}

                        </div>
                    </div>

                    {/* Footer / Pagination Controls */}
                    <div className="bg-white border-t border-gray-200 p-4 flex justify-between items-center z-10 flex-shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <button 
                            onClick={handlePrevPage} 
                            disabled={currentPage === 0}
                            className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold transition-all ${currentPage === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white border-2 border-emerald-500 text-emerald-600 hover:bg-emerald-50 shadow-sm'}`}
                        >
                            <ChevronLeft className="w-5 h-5" /> ก่อนหน้า
                        </button>

                        <div className="flex gap-2">
                            {[0, 1, 2, 3, 4].map(page => (
                                <button 
                                    key={page}
                                    onClick={() => changePage(page)}
                                    className={`w-3 h-3 rounded-full transition-all ${currentPage === page ? 'bg-emerald-500 w-8' : 'bg-gray-300 hover:bg-emerald-300'}`}
                                />
                            ))}
                        </div>

                        <button 
                            onClick={handleNextPage} 
                            disabled={currentPage === TOTAL_PAGES - 1}
                            className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold transition-all ${currentPage === TOTAL_PAGES - 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm'}`}
                        >
                            ถัดไป <ChevronRight className="w-5 h-5" />
                        </button>
                    </div>

                    {/* --- MODAL 1: Quick Facts --- */}
                    {selectedFact && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm transition-opacity animate-in fade-in" onClick={() => setSelectedFact(null)}>
                            <div className="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl transform transition-all animate-in zoom-in-95" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-6">
                                    <div className={`p-5 rounded-2xl ${selectedFact.bg}`}>
                                        {selectedFact.icon}
                                    </div>
                                    <button onClick={() => setSelectedFact(null)} className="text-gray-400 hover:text-gray-700 p-2 bg-gray-50 hover:bg-gray-200 rounded-full transition-colors">
                                        <XIcon className="w-6 h-6" />
                                    </button>
                                </div>
                                <h3 className="text-3xl font-extrabold text-gray-800 mb-2">{selectedFact.title}</h3>
                                <p className="text-emerald-600 font-bold mb-6 text-lg">{selectedFact.desc}</p>
                                <div className="bg-gray-50 p-6 rounded-2xl text-gray-700 text-base leading-relaxed border border-gray-100 shadow-inner">
                                    {selectedFact.details}
                                </div>
                                <div className="mt-8 flex justify-end">
                                    <button onClick={() => setSelectedFact(null)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-sm w-full sm:w-auto">
                                        เข้าใจแล้ว
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL 2: Insight (Cross-tabulation) --- */}
                    {selectedInsight && (() => {
                        const { data: insightData, categories } = getCrossTabData(parsedData, selectedInsight.mainCol, selectedInsight.subCol, selectedInsight.splitSubByComma);
                        
                        return (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-md transition-opacity animate-in fade-in" onClick={() => setSelectedInsight(null)}>
                                <div className="bg-white rounded-3xl p-6 md:p-8 max-w-4xl w-full shadow-2xl transform transition-all flex flex-col h-[85vh] max-h-[800px] animate-in zoom-in-95" onClick={(e) => e.stopPropagation()}>
                                    
                                    <div className="flex justify-between items-start mb-6 flex-shrink-0 border-b border-gray-100 pb-4">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-emerald-100 text-emerald-600 p-3 rounded-2xl">
                                                <Lightbulb className="w-8 h-8" />
                                            </div>
                                            <div>
                                                <h3 className="text-2xl font-extrabold text-gray-800 leading-tight">Insight เชิงลึก</h3>
                                                <p className="text-sm font-medium text-emerald-600 mt-1">{selectedInsight.title}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => setSelectedInsight(null)} className="text-gray-400 hover:text-gray-700 p-2 bg-gray-50 hover:bg-gray-200 rounded-full transition-colors">
                                            <XIcon className="w-6 h-6" />
                                        </button>
                                    </div>

                                    <div className="flex-grow w-full min-h-[300px]">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={insightData} margin={{ top: 20, right: 30, left: 0, bottom: 60 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                <XAxis dataKey="name" tick={{fontSize: 14, fontWeight: 'bold'}} />
                                                <YAxis />
                                                <Tooltip content={<CustomTooltip />} cursor={{fill: 'transparent'}} />
                                                <Legend wrapperStyle={{ paddingTop: '20px' }} />
                                                {categories.map((cat, idx) => (
                                                    <Bar key={cat} dataKey={cat} name={cat} fill={INSIGHT_COLORS[idx % INSIGHT_COLORS.length]} radius={[4, 4, 0, 0]} />
                                                ))}
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>

                                    <div className="mt-6 flex justify-end flex-shrink-0 pt-4 border-t border-gray-100">
                                        <button onClick={() => setSelectedInsight(null)} className="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-sm">
                                            ปิดหน้าต่าง
                                        </button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                </div>
            );
        }

        // 6. เริ่มต้นวาด React Component ลงบนหน้าเว็บ
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
